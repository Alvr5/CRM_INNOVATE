<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CRM Innovate Academy</title>
<style>
:root{color-scheme:light;--bg:#FBFBF8;--sf:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#e4e4dd;--ac:#2f5bea;--ok:#1f8a4c;--wr:#c27a00;--er:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#141416;--sf:#1e1e22;--tx:#eee;--mu:#9a9aa3;--bd:#33333a;--ac:#7c9bff;--ok:#4cc38a;--wr:#e0a030;--er:#ef7a6c}}
:root[data-theme=dark]{color-scheme:dark;--bg:#141416;--sf:#1e1e22;--tx:#eee;--mu:#9a9aa3;--bd:#33333a;--ac:#7c9bff;--ok:#4cc38a;--wr:#e0a030;--er:#ef7a6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--sf);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:16px;margin:0;margin-right:auto}nav{display:flex;gap:4px;overflow-x:auto;max-width:100%}
nav button,.btn{border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on,.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:16px;max-width:1300px;margin:auto}.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}
.bar input{max-width:280px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px}.kpi b{font-size:26px;display:block}.kpi span,.mu{color:var(--mu);font-size:12px}
.kan{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:8px}.col{min-width:230px;flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px}
.col h3{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}.item{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px;margin-bottom:8px;cursor:pointer}.item:hover{border-color:var(--ac)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--sf);border:1px solid var(--bd);border-radius:10px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px}tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;border:1px solid var(--bd)}.ok{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);width:min(480px,94vw);padding:16px}dialog::backdrop{background:#0008}
label{display:block;margin:8px 0 3px;font-size:12px;color:var(--mu)}.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}.bar2{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:6px}.bar2 i{display:block;height:100%;background:var(--ac)}
.chk{display:flex;flex-wrap:wrap;gap:6px}.ck{display:flex;align-items:center;gap:5px;margin:0;padding:4px 9px;border:1px solid var(--bd);border-radius:99px;font-size:12px;color:var(--tx);cursor:pointer}.ck input{width:auto}#lk{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}#lk[hidden]{display:none}#msg{color:var(--wr);padding:8px 16px;display:none}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<header><h1>🚀 CRM · Innovate Academy</h1><nav id="nav"></nav><button class="btn" id="lkn" title="Bloquear pantalla">🔒 Bloquear</button><button class="btn" id="th">◐</button></header>
<div id="msg"></div><div id="lk" hidden><b style="font-size:18px">🔒 Pantalla bloqueada</b><span class="mu">Se bloqueó por inactividad o por tu petición. Esto oculta los datos de la pantalla; no cierra tu sesión de Claude.</span><button class="btn pri" id="lkb">Desbloquear</button></div><main id="app"></main>
<dialog id="dlg"><form method="dialog" id="frm" onsubmit="return false"><div id="fld"></div><div class="row"><button class="btn er" id="del" type="button">Eliminar</button><button class="btn" id="cx" type="button">Cancelar</button><button class="btn pri" id="sv" type="button">Guardar</button></div></form></dialog>
<dialog id="d2"><div id="pv"></div><div class="row"><button class="btn" id="x2">Cancelar</button><button class="btn pri" id="go2">Importar</button></div></dialog>
<script>
const CURSOS=['HTML / CSS','Python','JavaScript','Otro'];
const E={
leads:{l:'Leads',n:'Lead',stage:'etapa',f:[['nombre','Nombre'],['contacto','WhatsApp / Discord / Email'],['curso','Curso de interés','s',CURSOS],['origen','Origen','s',['TikTok','Instagram','Discord','Twitch','Web','Referido','Otro']],['etapa','Etapa','s',['Nuevo','Contactado','Clase de prueba','Matriculado','Perdido']],['resp','Responsable'],['notas','Notas','t']]},
alumnos:{l:'Alumnos',n:'Alumno',f:[['nombre','Nombre'],['contacto','Contacto'],['curso','Curso','s',CURSOS],['estado','Estado','s',['Activo','Pausado','Baja']],['pago','Pago mensual','s',['Al día','Pendiente','Atrasado']],['inicio','Inicio','d'],['profe','Profesor'],['notas','Notas','t']]},
tareas:{l:'Tareas',n:'Tarea',f:[['titulo','Tarea'],['resp','Responsable'],['vence','Vence','d'],['prio','Prioridad','s',['Alta','Media','Baja']],['estado','Estado','s',['Pendiente','En curso','Hecha']],['notas','Notas','t']]},
equipo:{l:'Equipo',n:'Postulante',f:[['nombre','Nombre'],['contacto','Contacto'],['rol','Rol','s',['Profesor','Supervisor','Soporte','Marketing','Otro']],['estado','Estado','s',['Nuevo','Entrevista','Aceptado','Rechazado']],['notas','Notas','t']]}};
E.miembros={l:'Miembros',n:'Miembro',f:[['nombre','Nombre'],['rol','Roles (puedes elegir varios)','m',['CEO','Director','Co-fundador','Desarrollador','Diseñador','Profesor','Supervisor','Soporte','Marketing','Ventas','Community Manager','Administrador']],['contacto','WhatsApp / Email'],['discord','Discord'],['cursos','Cursos que imparte'],['disp','Disponibilidad'],['estado','Estado','s',['Activo','Inactivo']],['notas','Notas','t']]};
E.clases={l:'Clases',n:'Clase',f:[['curso','Curso','s',CURSOS],['grupo','Grupo'],['profe','Profesor'],['dia','Día','s',['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo']],['hora','Hora'],['fecha','Fecha','d'],['meet','Enlace Meet'],['estado','Estado','s',['Programada','Realizada','Cancelada']],['notas','Notas','t']]};
E.pagos={l:'Pagos',n:'Pago',f:[['nombre','Alumno'],['monto','Monto'],['mes','Mes (ej. 2026-11)'],['metodo','Método'],['fecha','Fecha','d'],['estado','Estado','s',['Pagado','Pendiente','Atrasado']],['notas','Notas','t']]};
const D={leads:[],alumnos:[],tareas:[],equipo:[],miembros:[],clases:[],pagos:[],historial:[]};let db=null,user=null,view='inicio',q='',cur=null,ce=null;
const $=s=>document.querySelector(s),esc=s=>String(Array.isArray(s)?s.join(', '):(s??'')).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tabs=[['inicio','Inicio'],...Object.keys(E).map(k=>[k,E[k].l]),['historial','Historial']];
function nav(){$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k==view?'on':''}" onclick="go('${k}')">${l}${k!='inicio'?' ('+D[k].length+')':''}</button>`).join('')}
function go(v){view=v;q='';render()}
function render(){nav();$('#app').innerHTML=view=='inicio'?dash():view=='historial'?hist():list(view);const s=$('#q');if(s){s.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}}
const cnt=(a,k,v)=>a.filter(x=>x[k]==v).length;
function dash(){const L=D.leads,A=D.alumnos,T=D.tareas,hoy=new Date().toISOString().slice(0,10);
const act=cnt(A,'estado','Activo'),mat=cnt(L,'etapa','Matriculado'),conv=L.length?Math.round(mat/L.length*100):0;
const late=T.filter(t=>t.estado!='Hecha'&&t.vence&&t.vence<hoy);
const k=(b,s)=>`<div class="card kpi"><b>${b}</b><span>${s}</span></div>`;
const by=(a,key,opts)=>opts.map(o=>{const n=cnt(a,key,o);return `<div style="margin-top:8px">${esc(o)} <span class="mu">${n}</span><div class="bar2"><i style="width:${a.length?n/a.length*100:0}%"></i></div></div>`}).join('');
return `<div class="grid">${k(L.length,'Leads totales')}${k(conv+'%','Conversión a matrícula')}${k(act,'Alumnos activos')}${k(cnt(A,'pago','Atrasado')+cnt(A,'pago','Pendiente'),'Pagos pendientes / atrasados')}${k(T.filter(t=>t.estado!='Hecha').length,'Tareas abiertas')}${k(late.length,'Tareas vencidas')}${k(D.miembros.filter(m=>m.estado!='Inactivo').length,'Miembros del equipo')}${k('$'+D.pagos.filter(p=>p.estado=='Pagado').reduce((s,p)=>s+(+p.monto||0),0),'Cobrado (total)')}</div>
<div class="grid" style="margin-top:12px"><div class="card"><b>Embudo de leads</b>${by(L,'etapa',E.leads.f[4][3])}</div><div class="card"><b>Alumnos por curso</b>${by(A,'curso',CURSOS)}</div><div class="card"><b>Origen de leads</b>${by(L,'origen',E.leads.f[3][3])}</div><div class="card"><b>Tareas vencidas</b>${late.map(t=>`<div class="er">${esc(t.titulo)} <span class="mu">${esc(t.resp)} · ${t.vence}</span></div>`).join('')||'<span class="mu">Nada vencido 🎉</span>'}</div></div>`}
function match(x){return !q||JSON.stringify(Object.values(x)).toLowerCase().includes(q.toLowerCase())}
function list(k){const e=E[k],R=D[k].filter(match);
let h=(k=='pagos'?stp2():'')+`<div class="bar"><input id="q" placeholder="Buscar…" value="${esc(q)}"><button class="btn pri" onclick="edit('${k}')">+ ${e.n}</button><button class="btn" onclick="csv('${k}')">Exportar CSV</button><button class="btn" onclick="imp('${k}')">⬆ Importar Excel</button><button class="btn" onclick="tpl('${k}')">Plantilla</button></div>`;
if(e.stage){const st=e.f.find(f=>f[0]==e.stage)[3];h+=`<div class="kan">`+st.map(s=>{const it=R.filter(x=>(x[e.stage]||st[0])==s);return `<div class="col"><h3>${s}<span class="mu">${it.length}</span></h3>${it.map(x=>`<div class="item" onclick="edit('${k}','${x.id}')"><b>${esc(x.nombre)}</b><div class="mu">${esc(x.contacto)}</div><div style="margin-top:4px"><span class="tag">${esc(x.curso)}</span> <span class="mu">${esc(x.resp)}</span></div></div>`).join('')}</div>`}).join('')+`</div>`;return h}
const cols=e.f.filter(f=>f[0]!='notas');
h+=`<div class="tw"><table><tr>${cols.map(f=>`<th>${f[1]}</th>`).join('')}</tr>`+R.map(x=>`<tr class="r" onclick="edit('${k}','${x.id}')">${cols.map(f=>{const v=x[f[0]],c=['Atrasado','Alta','Baja','Rechazado','Cancelada','Inactivo'].includes(v)?'er':['Pendiente','Entrevista','Pausado'].includes(v)?'wr':['Al día','Hecha','Aceptado','Activo','Pagado','Realizada'].includes(v)?'ok':'';return `<td class="${c}">${esc(v)}</td>`}).join('')}</tr>`).join('')+`</table></div>`+(R.length?'':'<p class="mu">Sin registros todavía.</p>');return h}
function edit(k,id){ce=k;Object.values(E).forEach(e=>e.f.forEach(f=>{if(f[0]=='resp'||f[0]=='profe'){f[2]='s';f[3]=['',...D.miembros.map(m=>m.nombre)]}}));cur=id?D[k].find(x=>x.id==id):null;const e=E[k],v=cur||{};if(!cur&&e.stage)v[e.stage]=e.f.find(f=>f[0]==e.stage)[3][0];
$('#fld').innerHTML=`<b>${cur?'Editar':'Nuevo'} · ${e.n}</b>`+e.f.map(([n,l,t,o])=>`<label>${l}</label>`+(t=='m'?`<div class="chk">${o.map(x=>`<label class="ck"><input type="checkbox" name="${n}" value="${x}" ${[].concat(v[n]||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div>`:t=='s'?`<select name="${n}">${o.map(x=>`<option ${v[n]==x?'selected':''}>${x}</option>`).join('')}</select>`:t=='t'?`<textarea rows="3" name="${n}">${esc(v[n])}</textarea>`:`<input name="${n}" type="${t=='d'?'date':'text'}" value="${esc(v[n])}">`)).join('');
$('#del').style.display=cur?'':'none';$('#dlg').showModal()}
$('#cx').onclick=()=>$('#dlg').close();
$('#sv').onclick=async()=>{if(!db)return warn('Sin conexión a la base de datos compartida. Abre el CRM desde claude.ai con sesión iniciada.');const d={};document.querySelectorAll('#fld [name]').forEach(i=>{if(i.type=='checkbox'){d[i.name]=d[i.name]||[];if(i.checked)d[i.name].push(i.value)}else d[i.name]=i.value.trim()});
if(!(d.nombre||d.titulo))return;try{if(cur){const{id:_i,...rest}=cur;const cam=diff(ce,cur,d);const lab=d.nombre||d.titulo||'';await db.collection(ce).doc(cur.id).set({...rest,...d,upd:Date.now()});if(cam)lg(ce,'editó',lab,cam);}else{await db.collection(ce).add({...d,creado:Date.now(),por:user?await user.id():''});lg(ce,'creó',d.nombre||d.titulo||'','')}$('#dlg').close()}catch(e){warn('No se pudo guardar: '+(e.code||e.message)+'. Puede que solo tengas permiso de lectura.')}};
$('#del').onclick=async()=>{if(confirm('¿Eliminar este registro?')){try{await db.collection(ce).doc(cur.id).delete();lg(ce,'eliminó',cur.nombre||cur.titulo||'','');$('#dlg').close()}catch(e){warn('No se pudo eliminar.')}}};
const ALI={nombre:['alumno','cliente','estudiante','name'],monto:['importe','valor','precio','pago','amount','total'],mes:['periodo','mensualidad'],metodo:['medio','forma de pago','metodo de pago'],fecha:['date','fecha de pago'],estado:['status','situacion'],contacto:['telefono','whatsapp','email','correo']};
const nz=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
let PEND=null;
function imp(k){if(!window.XLSX)return warn('No se pudo cargar el lector de Excel.');if(!db)return warn('Sin conexión a la base de datos compartida.');const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});prep(k,XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true}),f.name)}catch(e){warn('No se pudo leer el archivo.')}};i.click()}
function conv(k,f,v){const[n,,t,o]=f;if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
if(t=='m')return String(v).split(/[,;/]/).map(s=>s.trim()).filter(Boolean).map(s=>o.find(x=>nz(x)==nz(s))||s);
if(t=='s'){const m=o.find(x=>nz(x)==nz(v));return m||(k=='pagos'?'Pendiente':o[0])}
if(n=='monto'){let s=String(v).replace(/[^\d.,-]/g,'');if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');else if(s.includes(','))s=s.replace(',','.');return s}
return String(v).trim()}
function prep(k,rows,fn){const e=E[k];if(!rows.length)return warn('El archivo está vacío.');const hs=Object.keys(rows[0]),map={};
e.f.forEach(f=>{const c=[f[0],f[1],...(ALI[f[0]]||[])].map(nz);const h=hs.find(h=>c.includes(nz(h)));if(h!==undefined)map[f[0]]=h});
const first=e.f[0];if(map[first[0]]===undefined)return warn('No encontré la columna "'+first[1]+'" en el archivo. Descarga la plantilla para ver los encabezados.');
let recs=rows.map(r=>{const d={};e.f.forEach(f=>{if(map[f[0]]!==undefined)d[f[0]]=conv(k,f,r[map[f[0]]])});return d}).filter(d=>d[first[0]]);
let dup=0;if(k=='pagos'){const sg=d=>[d.nombre,d.mes,d.monto].join('|');const ex=new Set(D.pagos.map(sg));recs=recs.filter(d=>{const s=sg(d);if(ex.has(s)){dup++;return false}ex.add(s);return true})}
PEND={k,recs};const un=hs.filter(h=>!Object.values(map).includes(h));
$('#pv').innerHTML=`<b>Importar a ${e.l}</b><p class="mu">${esc(fn)}</p><p><b>${recs.length}</b> registros nuevos${dup?` · ${dup} duplicados omitidos`:''}</p><p class="mu">Columnas reconocidas: ${e.f.filter(f=>map[f[0]]!==undefined).map(f=>esc(f[1])).join(', ')}${un.length?`<br>Ignoradas: ${un.map(esc).join(', ')}`:''}</p><div class="tw"><table><tr>${e.f.filter(f=>map[f[0]]!==undefined).map(f=>`<th>${esc(f[1])}</th>`).join('')}</tr>${recs.slice(0,5).map(d=>`<tr>${e.f.filter(f=>map[f[0]]!==undefined).map(f=>`<td>${esc(d[f[0]])}</td>`).join('')}</tr>`).join('')}</table></div>`;
$('#go2').disabled=!recs.length;$('#d2').showModal()}
$('#x2').onclick=()=>$('#d2').close();
$('#go2').onclick=async()=>{if(!PEND)return;const b=$('#go2');b.disabled=true;const{k,recs}=PEND;let n=0,uid='';try{uid=user?await user.id():''}catch(e){}
for(const d of recs){try{await db.collection(k).add({...d,creado:Date.now(),por:uid});n++;b.textContent=n+' / '+recs.length}catch(e){warn('Se importaron '+n+' de '+recs.length+'. Error: '+(e.code||e.message));break}}
if(n)lg(k,'importó','Excel',n+' registros');b.disabled=false;b.textContent='Importar';PEND=null;$('#d2').close();if(n==recs.length)warn('✔ Importados '+n+' registros en '+E[k].l+'.')};
let ST={ch:null,rows:null,count:0,accs:null,sel:'',live:false,at:0,per:'month',acc:null,busy:false,err:'',cur:'usd',more:false,multi:false};
const p2=n=>String(n).padStart(2,'0');
const mon=(c,cu)=>{try{return new Intl.NumberFormat('es',{style:'currency',currency:cu||'USD'}).format(c/100)}catch(e){return (c/100).toFixed(2)+' '+cu}};
const dstr=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const kf=s=>{const y=s.slice(0,4),m=+s.slice(5,7);return ST.per=='day'?s:ST.per=='month'?s.slice(0,7):ST.per=='quarter'?y+'-T'+Math.ceil(m/3):y};
function keys(){const n=new Date(),o=[],per=ST.per;
if(per=='day')for(let i=29;i>=0;i--)o.push(kf(dstr(new Date(n.getFullYear(),n.getMonth(),n.getDate()-i))));
else if(per=='month')for(let i=11;i>=0;i--)o.push(kf(dstr(new Date(n.getFullYear(),n.getMonth()-i,1))));
else if(per=='quarter'){let y=n.getFullYear(),q=Math.ceil((n.getMonth()+1)/3);for(let i=0;i<8;i++){o.unshift(y+'-T'+q);if(--q==0){q=4;y--}}}
else{const ys=ST.rows.map(r=>+r[0].slice(0,4)),a=Math.min(n.getFullYear(),...ys);for(let y=a;y<=n.getFullYear();y++)o.push(String(y))}
return o}
function stp(){const s=ST;let h=`<div class='card' style='margin-bottom:14px'><div class='bar' style='margin:0 0 10px'><b style='margin-right:auto'>💳 Stripe${s.acc?` <span class='tag'>${s.acc.livemode?'LIVE':'TEST'}</span>`:''}</b>`;
if(s.ch)h+=[['day','Diario'],['month','Mensual'],['quarter','Trimestral'],['year','Anual']].map(([a,b])=>`<button class='btn ${s.per==a?'pri':''}' onclick="ST.per='${a}';render()">${b}</button>`).join('')+`<button class='btn' onclick='stImp()'>Guardar en Pagos</button>`;
h+=`<button class='btn pri' onclick='stLoad()' ${s.busy?'disabled':''}>${s.busy?'Cargando…':s.ch?'Actualizar':'Cargar desde Stripe'}</button></div>`;
if(s.err)h+=`<p class='er'>${esc(s.err)}</p>`;
if(s.ch)h+=stChart();else if(!s.err)h+=`<p class='mu'>Conecta Stripe para ver ingresos por día, mes, trimestre y año.</p>`;
return h+`</div>`}
function stChart(){const K=keys(),m={};
ST.rows.forEach(([d,v,r,n])=>{const k=kf(d),o=m[k]||(m[k]={v:0,r:0,n:0});o.v+=v;o.r+=r;o.n+=n});
const V=K.map(k=>m[k]||{v:0,r:0,n:0}),net=V.map(x=>x.v-x.r),mx=Math.max(1,...net),T=V.reduce((a,x)=>({v:a.v+x.v,r:a.r+x.r,n:a.n+x.n}),{v:0,r:0,n:0}),cu=ST.cur.toUpperCase(),W=700,H=220,bw=W/K.length;
const bars=K.map((k,i)=>{const h=net[i]/mx*(H-40);return `<rect x='${i*bw+bw*.12}' y='${H-25-h}' width='${bw*.76}' height='${Math.max(h,0)}' rx='3' fill='var(--ac)'><title>${k}: ${mon(net[i],cu)} · ${V[i].n} pagos</title></rect>`+((K.length<=14||i%Math.ceil(K.length/10)==0)?`<text x='${i*bw+bw/2}' y='${H-8}' text-anchor='middle' font-size='10' fill='var(--mu)'>${ST.per=='day'?k.slice(5):k}</text>`:'')}).join('');
const kp=(b,s)=>`<div class='card kpi'><b>${b}</b><span>${s}</span></div>`;
return `<div class='grid' style='margin-bottom:10px'>${kp(mon(T.v-T.r,cu),'Ingresos netos')}${kp(mon(T.r,cu),'Reembolsos')}${kp(T.n,'Pagos')}${kp(mon(T.n?(T.v-T.r)/T.n:0,cu),'Ticket promedio')}</div><svg viewBox='0 0 ${W} ${H}' width='100%' role='img'>${bars}</svg><p class='mu'>${ST.count} cobros${ST.more?' (solo los últimos 1000)':''}${ST.at?' · actualizado '+new Date(ST.at).toLocaleDateString('es'):''} · moneda ${cu}${ST.multi?' · hay cobros en otras monedas que no se incluyen':''}</p>`}
async function stLoad(){ST.busy=true;ST.err='';render();
try{const mcp=await claude.use('mcp');if(!mcp)throw{code:'na'};
const a=(await mcp.callTool('Stripe','list_available_accounts_or_orgs',{})).payload,acc=((a&&a.accounts)||[])[0];if(!acc)throw{code:'noacc'};ST.acc=acc;
let all=[],after=null,more=false;for(let i=0;i<10;i++){const p={limit:100};if(after)p.starting_after=after;const r=(await mcp.callTool('Stripe','stripe_api_read',{stripe_context:acc.stripe_context,livemode:acc.livemode,stripe_api_operation_id:'GetCharges',parameters:p})).payload,d=(r&&r.data)||[];all=all.concat(d);more=!!(r&&r.has_more);if(!more||!d.length)break;after=d[d.length-1].id}
ST.ch=all;ST.more=more;const cc={};all.forEach(c=>cc[c.currency]=(cc[c.currency]||0)+1);const ks=Object.keys(cc).sort((x,y)=>cc[y]-cc[x]);ST.cur=ks[0]||'usd';ST.multi=ks.length>1}
catch(e){ST.err=({na:'Esta vista no puede usar conectores. Ábrelo en claude.ai.',noacc:'No hay ninguna cuenta de Stripe autorizada en tu conector.',needs_reauth:'La sesión de Stripe caducó: reconéctala en Ajustes → Conectores.',server_not_connected:'Añade Stripe en Ajustes → Conectores de claude.ai.',not_in_manifest:'No permitiste que esta página use Stripe.',approval_required:'Se necesita tu aprobación para usar Stripe.'})[e.code]||('Error de Stripe: '+(e.message||e.code))}
ST.busy=false;render()}
async function stImp(){if(!db)return warn('Sin conexión a la base de datos compartida.');const ex=new Set(D.pagos.map(p=>p.stripe).filter(Boolean)),L=ST.ch.filter(c=>c.paid&&c.status=='succeeded'&&!ex.has(c.id));
if(!L.length)return warn('No hay cobros nuevos de Stripe para guardar.');let n=0;
for(const c of L){const d=new Date(c.created*1000),b=c.billing_details||{};try{await db.collection('pagos').add({nombre:b.name||b.email||c.customer||'Cliente Stripe',monto:((c.amount-(c.amount_refunded||0))/100).toFixed(2),mes:d.getFullYear()+'-'+p2(d.getMonth()+1),metodo:'Stripe',fecha:d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),estado:'Pagado',stripe:c.id,creado:Date.now()});n++}catch(e){warn('Se guardaron '+n+' de '+L.length+'. Error: '+(e.code||e.message));return}}
lg('pagos','importó','Stripe',n+' cobros');warn('✔ '+n+' cobros de Stripe guardados en Pagos.')}
const adm=()=>{try{return !!(user&&user.canEdit())}catch(e){return false}};
const STERR={na:'Esta vista no puede usar conectores. Ábrela en claude.ai.',noacc:'Tu conector de Stripe no tiene ninguna cuenta autorizada.',needs_reauth:'La sesión de Stripe caducó: reconéctala en Ajustes → Conectores.',server_not_connected:'Añade Stripe en Ajustes → Conectores de claude.ai.',not_in_manifest:'No permitiste que esta página use Stripe.',approval_required:'Se necesita tu aprobación para usar Stripe.'};
function setP(a){ST.per=a;render()}
function stp2(){const s=ST,ad=adm();let h=`<div class='card' style='margin-bottom:14px'><div class='bar' style='margin:0 0 10px'><b style='margin-right:auto'>💳 Stripe${s.rows?` <span class='tag'>${s.live?'LIVE':'TEST'}</span>`:''}</b>`;
if(s.rows)h+=[['day','Diario'],['month','Mensual'],['quarter','Trimestral'],['year','Anual']].map(([a,b])=>`<button class='btn ${s.per==a?'pri':''}' data-p='${a}' onclick='setP(this.dataset.p)'>${b}</button>`).join('');
if(ad){if(s.accs)h+=`<select style='width:auto' onchange='ST.sel=this.value'><option value=''>— elige tu cuenta —</option>${s.accs.map(a=>`<option value='${esc(a.stripe_context)}' ${s.sel==a.stripe_context?'selected':''}>${esc(a.name||a.stripe_context)} (${a.livemode?'LIVE':'TEST'})</option>`).join('')}</select><button class='btn pri' onclick='stGo()' ${s.busy?'disabled':''}>${s.busy?'Cargando…':'Cargar cobros'}</button>`;else h+=`<button class='btn pri' onclick='stAcc()' ${s.busy?'disabled':''}>${s.rows?'Actualizar desde Stripe':'Conectar Stripe'}</button>`;if(s.ch)h+=`<button class='btn' onclick='stImp()'>Guardar en Pagos</button>`}
h+=`</div>`;if(s.err)h+=`<p class='er'>${esc(s.err)}</p>`;
h+=s.rows?stChart():`<p class='mu'>${ad?'Conecta tu cuenta de Stripe: se guardará un resumen de ingresos que verá todo el equipo.':'Aún no hay datos de Stripe. Un administrador (CEO) debe conectarlos.'}</p>`;return h+`</div>`}
async function stAcc(){ST.busy=true;ST.err='';render();try{const mcp=await claude.use('mcp');if(!mcp)throw{code:'na'};const a=(await mcp.callTool('Stripe','list_available_accounts_or_orgs',{})).payload,l=(a&&a.accounts)||[];if(!l.length)throw{code:'noacc'};ST.accs=l;ST.sel=''}catch(e){ST.err=STERR[e.code]||('Error de Stripe: '+(e.message||e.code))}ST.busy=false;render()}
function mkRows(ch,cur){const m={};ch.filter(c=>c.paid&&c.status=='succeeded'&&c.currency==cur).forEach(c=>{const k=dstr(new Date(c.created*1000)),o=m[k]||(m[k]=[k,0,0,0]);o[1]+=c.amount;o[2]+=c.amount_refunded||0;o[3]++});return Object.values(m).sort((x,y)=>x[0]<y[0]?-1:1)}
async function stGo(){const acc=(ST.accs||[]).find(a=>a.stripe_context==ST.sel);if(!acc){ST.err='Elige primero tu cuenta de Stripe.';return render()}ST.busy=true;ST.err='';render();
try{const mcp=await claude.use('mcp');if(!mcp)throw{code:'na'};let all=[],after=null,more=false;
for(let i=0;i<10;i++){const p={limit:100};if(after)p.starting_after=after;const r=(await mcp.callTool('Stripe','stripe_api_read',{stripe_context:acc.stripe_context,livemode:acc.livemode,stripe_api_operation_id:'GetCharges',parameters:p})).payload,d=(r&&r.data)||[];all=all.concat(d);more=!!(r&&r.has_more);if(!more||!d.length)break;after=d[d.length-1].id}
const cc={};all.forEach(c=>cc[c.currency]=(cc[c.currency]||0)+1);const ks=Object.keys(cc).sort((x,y)=>cc[y]-cc[x]),cur=ks[0]||'usd',rows=mkRows(all,cur),at=Date.now();
Object.assign(ST,{ch:all,rows,cur,multi:ks.length>1,more,count:all.length,at,live:acc.livemode,acc:null,accs:null,sel:''});
if(db)try{await db.collection('stripe').doc('snapshot').set({rows,cur,multi:ks.length>1,more,count:all.length,at,live:acc.livemode})}catch(e){ST.err='Se cargaron los datos pero no se pudieron compartir con el equipo ('+(e.code||e.message)+').'}}
catch(e){ST.err=STERR[e.code]||('Error de Stripe: '+(e.message||e.code))}ST.busy=false;render()}
const NM={};
const s0=v=>{const t=Array.isArray(v)?v.join(', '):String(v??'');return t.length>40?t.slice(0,40)+'…':t};
function diff(col,o,n){return E[col].f.filter(f=>n[f[0]]!==undefined&&JSON.stringify(o[f[0]]??'')!=JSON.stringify(n[f[0]])).map(f=>f[1]+': '+s0(o[f[0]])+' → '+s0(n[f[0]])).join('; ')}
async function lg(col,acc,reg,cam){if(!db)return;try{await db.collection('historial').add({col,acc,reg:String(reg||''),cam:cam||'',por:user?await user.id():'',t:Date.now()})}catch(e){}}
function names(ids){if(!user||!user.profiles)return;const need=[...new Set(ids)].filter(i=>i&&!(i in NM));if(!need.length)return;need.forEach(i=>NM[i]='…');user.profiles(need).then(p=>{need.forEach(i=>NM[i]=(p&&p[i]&&p[i].name)||'Alguien');if(view=='historial')render()}).catch(()=>{need.forEach(i=>NM[i]='Alguien')})}
function hist(){names(D.historial.map(h=>h.por));const R=D.historial.filter(match);return `<div class='bar'><input id='q' placeholder='Buscar…' value='${esc(q)}'></div><div class='tw'><table><tr><th>Fecha</th><th>Quién</th><th>Acción</th><th>Módulo</th><th>Registro</th><th>Cambios</th></tr>${R.map(h=>`<tr><td>${new Date(h.t).toLocaleString('es')}</td><td>${esc(NM[h.por]||'…')}</td><td>${esc(h.acc)}</td><td>${esc(E[h.col]?E[h.col].l:h.col)}</td><td>${esc(h.reg)}</td><td style='white-space:normal;min-width:220px'>${esc(h.cam)}</td></tr>`).join('')}</table></div>`+(R.length?'':`<p class='mu'>Sin cambios registrados todavía.</p>`)}
let idle;const LK=()=>{$('#lk').hidden=false};
function rst(){clearTimeout(idle);idle=setTimeout(LK,300000)}
['mousemove','keydown','click','touchstart'].forEach(e=>addEventListener(e,rst,{passive:true}));rst();
$('#lkb').onclick=()=>{$('#lk').hidden=true;rst()};$('#lkn').onclick=LK;
async function tpl(k){const s=E[k].f.map(f=>f[1]).join(',')+'\n';try{const d=await claude.use('downloads');if(!d)return warn('Descarga no disponible aquí.');await d.save({filename:'plantilla-'+k+'.csv',data:'\ufeff'+s})}catch(e){}}
function warn(t){const m=$('#msg');m.textContent=t;m.style.display='block'}
async function csv(k){const f=E[k].f,rows=[f.map(x=>x[1]),...D[k].map(x=>f.map(y=>x[y[0]]??''))];const s=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');try{const d=await claude.use('downloads');if(!d)return warn('Descarga no disponible aquí.');await d.save({filename:k+'.csv',data:'\ufeff'+s})}catch(e){}}
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes('dark');r.dataset.theme=d?'light':'dark'};
render();
(async()=>{try{db=await claude.use('db');user=await claude.use('user')}catch(e){}
const lock=()=>{$('#nav').innerHTML='';$('#app').innerHTML=`<div class='card' style='max-width:460px;margin:60px auto;text-align:center'><b>🔒 Acceso restringido</b><p class='mu'>Inicia sesión en claude.ai con una cuenta autorizada para ver el CRM. Si no tienes acceso, pide al administrador que te invite.</p></div>`};if(!db){lock();return}
db.collection('historial').orderBy('t','desc').limit(200).onSnapshot(s=>{D.historial=s.docs.map(d=>({...d.data(),id:d.id}));if(!$('#dlg').open&&!$('#d2').open)render()},e=>{});
db.collection('stripe').doc('snapshot').onSnapshot(s=>{const d=s.data();if(d&&d.rows&&!ST.ch){Object.assign(ST,{rows:d.rows,cur:d.cur,multi:d.multi,more:d.more,count:d.count,at:d.at,live:d.live});if(view=='pagos'&&!$('#dlg').open)render()}},e=>{});
Object.keys(E).forEach(k=>db.collection(k).onSnapshot(s=>{D[k]=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.creado||0)-(a.creado||0));if(!$('#dlg').open)render();else nav()},e=>warn('Error de datos: '+(e.code||''))))})();
</script></body></html>
