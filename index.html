<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM · Innovate Academy</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Estilos para la pantalla de inicio de sesión centrada */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 16px;
    font-family: sans-serif;
  }
</style>
</head>
<body>

<!-- Pantalla de Login inicial (Se oculta al iniciar sesión) -->
<div id="login-screen">
  <h2>CRM · Innovate Academy</h2>
  <p style="color: var(--mu, #666);">Inicia sesión con tu cuenta de Discord para acceder</p>
  <button id="btn-discord" class="btn pri" style="background:#5865F2; color:white; padding:10px 20px; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">Iniciar sesión con Discord</button>
</div>

<!-- Contenedor principal del CRM (Oculto por defecto hasta autenticarse) -->
<div id="crm-container" style="display:none;">
  <header>
    <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
      <h1>CRM · Innovate Academy</h1>
      <div id="user-info" style="display:flex; align-items:center; gap:8px;"></div>
    </div>
    <nav id="nav"></nav>
    <button class="btn" id="bk">Copia de seguridad</button>
    <button class="btn" id="rs">Restaurar</button>
    <input type="file" id="rf" accept=".json" hidden>
  </header>
  <main id="app"></main>
</div>

<dialog id="dlg">
  <form id="frm" onsubmit="return false">
    <div id="fld"></div>
    <div class="row">
      <button class="btn er" id="del" type="button">Eliminar</button>
      <button class="btn" id="cx" type="button">Cancelar</button>
      <button class="btn pri" id="sv" type="button">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Se usa type="module" para soportar Firebase Auth -->
<script type="module" src="app.js"></script>
</body>
</html>
